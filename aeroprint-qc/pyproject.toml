[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroprint-qc"
version = "1.0.0"
description = "SPC and process-capability screening for 3D-printed titanium brackets (educational prototype)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7.0", "httpx>=0.27", "pyyaml"]

[tool.setuptools]
package-dir = {"" = "app"}
py-modules = ["qc"]
